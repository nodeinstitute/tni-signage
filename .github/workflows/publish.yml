# Publishes the signage: every 10 minutes it reads the Nextcloud Play folder (share link in the
# secret NEXTCLOUD_SHARE) and, once a change has been stable for one interval, updates slides.json,
# slides/ and videos/, commits them and deploys the site. A push (e.g. a player change) or a manual
# run ("Run workflow" on the Actions tab) deploys straight away.
# Settings -> Pages -> Source must be "GitHub Actions".
name: Publish signage

on:
  schedule:
    # every 10 minutes, off the full hour (GitHub drops timed runs more often at :00 when it is busy)
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-signage
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest state, not the one from when the run was queued (9 Oct)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet opencv-python-headless numpy requests

      - name: Read the Play folder
        env:
          NEXTCLOUD_SHARE: ${{ secrets.NEXTCLOUD_SHARE }}
        run: python tools/sync_from_nextcloud.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "signage-bot"
          git config user.email "signage-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Signage from Nextcloud: $(python -c "import json;m=json.load(open('slides.json'));print(m['id'], len(m['slides']), 'items')")"
            # another run may have pushed meanwhile (9 Oct: "rejected, fetch first"): rebase onto it and retry;
            # if the two runs changed the same files, give up cleanly; the next run starts from the new state
            ok=false
            for i in 1 2 3; do
              if git pull --rebase -q origin main && git push; then ok=true; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$ok" != true ]; then echo "::warning::could not push (another run changed the same files); the next run will catch up"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            # a set was published only if slides.json changed (state.json alone = still waiting)
            if git diff --name-only HEAD~1 HEAD | grep -q '^slides.json$'; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Prepare site
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: mkdir -p _site && cp -r index.html sw.js slides.json slides videos _site/ 2>/dev/null; touch _site/.nojekyll; ls _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

      - id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
