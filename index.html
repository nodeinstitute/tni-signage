<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* iiSignage may show this page from a copy on its own server, where "slides.json" and "slides/…"
   do not exist (seen as "slides.json HTTP 404", 2 Oct): anywhere but GitHub Pages or a local test
   server, resolve every address against the real site */
if (!/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
  var base = document.createElement("base");
  base.href = "https://thenodeinstitute.github.io/tni-signage/";
  document.head.insertBefore(base, document.head.firstChild);
}</script>
<meta name="robots" content="noindex, nofollow">
<title>TNI Signage</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .slide {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;   /* no "inset": older Android WebViews ignore it */
    object-fit: contain; opacity: 0; transition: opacity 0.8s ease;
  }
  .slide.on { opacity: 1; }
  /* shown until the first slide is up, so a black screen always says why */
  #status {
    position: fixed; left: 0; right: 0; top: 45%; z-index: 9; text-align: center;
    font: 22px/1.5 sans-serif; color: #888; padding: 0 24px;
  }
  #debug {
    position: fixed; left: 8px; bottom: 8px; z-index: 9; display: none;
    font: 14px/1.4 monospace; color: #0f0; background: rgba(0,0,0,.7); padding: 6px 8px; white-space: pre;
  }
</style>
</head>
<body>
<img class="slide" id="a" alt="">
<img class="slide" id="b" alt="">
<div id="debug"></div>
<div id="status">TNI Signage · starting…</div>
<script>
/* any script error before the first slide is shown on screen instead of leaving it black */
window.onerror = function (msg, src, line) {
  var s = document.getElementById("status");
  if (s && s.style.display !== "none") s.textContent = "TNI Signage · error: " + msg + " (line " + line + ")";
};
window.addEventListener("unhandledrejection", function (e) { window.onerror(String(e.reason), "", 0); });
</script>
<script>
/* The NODE Institute signage player.
   Plays the slides and videos listed in slides.json in order, re-reads slides.json at the start of
   every round (and at least every CHECK_MS), switches to a new set only after all its images are
   loaded and its videos are downloaded to the screen, and keeps playing the last good set when the
   network is down. Publish a new set with
   indesign-mcp\publish_signage_web.py; the screen never needs touching. */
const PLAYER = 3;                    // bump together with "player" in slides.json to force a reload
const CACHE = "tni-signage-slides";  // slide images and videos (sw.js serves from it)
const CHECK_MS = 5 * 60 * 1000;      // re-read slides.json at least this often
const FALLBACK_DURATION = 30;        // seconds per slide if slides.json does not say
const FIRST_VIDEO_DELAY = 2 * 60 * 1000;  // first visit: wait before downloading videos (editor previews)
const FRAMED_DELAY = 60 * 1000;      // inside a frame (iiSignage editor): show one still this long first
const STORE = "tni-signage-manifest";
const DEBUG = /[?&]debug\b/.test(location.search);

const layers = [document.getElementById("a"), document.getElementById("b")];
const dbg = document.getElementById("debug");
let front = 0, set = null, pending = null, index = -1, lastCheck = 0, lastError = "", note = "", started = Date.now();

const statusEl = document.getElementById("status");
function status(msg) { if (statusEl.style.display !== "none") statusEl.textContent = "TNI Signage · " + msg; }
function log(msg) { lastError = msg; status(msg); render(); }
function render() {
  if (!DEBUG) return;
  dbg.style.display = "block";
  dbg.textContent = [
    "set " + (set ? set.id + " (" + set.slides.length + " slides, " + set.published + ")" : "none"),
    "slide " + (index + 1),
    "checked " + (lastCheck ? new Date(lastCheck).toLocaleTimeString() : "never"),
    pending ? "next set " + pending.id + " ready" : "",
    note,
    lastError ? "note: " + lastError : ""
  ].join("\n");
}

function preload(src) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(() => resolve(src));
    im.onerror = () => reject(new Error("image failed: " + src));
    im.src = src;
  });
}

/* Download a video completely into the cache (once); sw.js then serves it to the <video> element
   from the screen's own storage, offline too. */
async function cacheVideo(src) {
  if (!("caches" in window)) return;
  const url = new URL(src, location.href).href;
  const c = await caches.open(CACHE);
  if (await c.match(url)) return;
  const r = await fetch(url, { cache: "no-store" });
  if (r.status !== 200) throw new Error("video download failed: " + src + " (HTTP " + r.status + ")");
  await c.put(url, r);
}

async function cacheVideos(m) {
  const videos = m.slides.filter(s => s.type === "video");
  for (let i = 0; i < videos.length; i++) {
    note = "downloading video " + (i + 1) + " of " + videos.length; render();
    await cacheVideo(videos[i].src);
  }
  note = ""; render();
}

/* Read slides.json and get a new set ready in the background while the current one keeps
   playing: images loaded and every video downloaded before the switch (the first set ever
   starts as soon as its images are there and fetches its videos while it plays). */
let checking = null;
function check() {
  if (!checking) checking = doCheck().finally(() => { checking = null; });
  return checking;
}
/* slides.json asks for another player version: load the page again, bypassing caches (a new ?v=
   address), at most once every 3 minutes. GitHub Pages lets browsers keep the page for 10 minutes,
   so a plain reload could fetch the old page again and again (that loop flickered on 2 Oct). */
function updatePlayer(wanted) {
  const KEY = "tni-signage-reload";
  let last = 0;
  try { last = Number(localStorage.getItem(KEY) || 0); } catch (e) {}
  if (Date.now() - last < 3 * 60 * 1000) { log("waiting for player version " + wanted); return; }
  try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
  location.replace(location.pathname + "?v=" + wanted + "-" + Date.now() + (DEBUG ? "&debug" : ""));
}

async function doCheck() {
  lastCheck = Date.now();
  try {
    const r = await fetch("slides.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("slides.json HTTP " + r.status);
    const m = await r.json();
    if (m.player && m.player !== PLAYER) { updatePlayer(m.player); return; }
    if (!m.slides || !m.slides.length) throw new Error("slides.json has no slides");
    if (set && m.id === set.id && !pending) { pruneCache(set); lastError = ""; return; }   // current: drop leftovers
    if (pending && m.id === pending.id) { lastError = ""; return; }
    const images = m.slides.filter(s => s.type !== "video");
    let loaded = 0;
    if (!set) status("loading slides 0 of " + images.length);
    await Promise.all(images.map(s => preload(s.src).then(x => { loaded++; if (!set) status("loading slides " + loaded + " of " + images.length); return x; })));
    if (set) await cacheVideos(m);
    else {
      // first visit: start the ~100 MB video download only after 2 minutes, so a short visit (the
      // iiSignage editor rendering a preview while saving) does not pull all the videos; until a video
      // is downloaded it streams when its turn comes
      setTimeout(() => cacheVideos(m).catch(e => log(e.message || String(e))), FIRST_VIDEO_DELAY);
    }
    pending = m;
    try { localStorage.setItem(STORE, JSON.stringify(m)); } catch (e) {}
    lastError = "";
  } catch (e) {
    log(e.message || String(e));                              // offline or bad publish: keep the current set
  }
}

async function pruneCache(m) {
  if (!("caches" in window)) return;
  try {
    const keep = new Set(m.slides.map(s => new URL(s.src, location.href).href));
    const c = await caches.open(CACHE);
    for (const req of await c.keys()) if (!keep.has(req.url)) await c.delete(req);
  } catch (e) {}
}

/* Play one video full screen, muted, to its end. Resolves false when it cannot start within
   20 s (offline, missing file), so the player moves on instead of hanging on a black screen. */
function playVideo(s) {
  const vid = videoElement();
  return new Promise(resolve => {
    let done = false;
    const finish = ok => {
      if (done) return; done = true;
      clearTimeout(startTimer); clearTimeout(endTimer);
      vid.onplaying = vid.onended = vid.onerror = null;
      resolve(ok);
    };
    const startTimer = setTimeout(() => finish(false), 20000);
    const endTimer = setTimeout(() => finish(true), 1000 * ((s.duration || 180) + 20));
    vid.onplaying = () => { clearTimeout(startTimer); vid.classList.add("on"); layers.forEach(l => l.classList.remove("on")); statusEl.style.display = "none"; render(); };
    vid.onended = () => finish(true);
    vid.onerror = () => finish(false);
    vid.muted = true;
    vid.src = s.src;
    const p = vid.play();
    if (p && p.catch) p.catch(() => finish(false));
  });
}

/* The <video> element exists only while a video plays. An empty one in the page from the start made
   saving a playlist in the iiSignage editor crawl (2 Oct): its thumbnail capture seems to wait for
   every video in the page to load, and an empty one never does. */
let vid = null;
function videoElement() {
  if (!vid) {
    vid = document.createElement("video");
    vid.className = "slide";
    vid.muted = true;
    vid.playsInline = true;
    vid.setAttribute("playsinline", "");
    vid.preload = "auto";
    document.body.appendChild(vid);   // above the slides; #status and #debug stay on top (z-index)
  }
  return vid;
}

function stopVideo() {
  if (!vid || !vid.classList.contains("on")) return;
  const old = vid;
  old.classList.remove("on");
  setTimeout(() => {
    if (old.classList.contains("on")) return;     // a following video reused it
    old.pause(); old.removeAttribute("src"); old.load(); old.remove();
    if (vid === old) vid = null;
  }, 900);
}

function duration(s) { return 1000 * (s.duration || (set && set.duration) || FALLBACK_DURATION); }

async function next() {
  const wrap = !set || index < 0 || index + 1 >= set.slides.length;
  if (wrap || Date.now() - lastCheck > CHECK_MS) {
    if (set) check(); else await check();                     // never hold up a running show for a download
  }
  if (pending && wrap) { set = pending; pending = null; index = -1; pruneCache(set); }
  if (!set) { setTimeout(next, 15000); return; }             // nothing to show yet: retry
  index = (index + 1) % set.slides.length;
  const s = set.slides[index];
  if (s.type === "video") {
    render();
    if (!(await playVideo(s))) log("video skipped: " + (s.name || s.src));
    next();
    return;
  }
  const back = layers[1 - front];
  back.onload = () => { back.classList.add("on"); layers[front].classList.remove("on"); front = 1 - front; stopVideo(); statusEl.style.display = "none"; render(); };
  back.onerror = () => log("cannot show " + s.src);
  back.src = s.src;
  // a daily reload around 4 am keeps a long-running WebView fresh
  if (Date.now() - started > 20 * 3600 * 1000 && new Date().getHours() === 4 && navigator.onLine) { location.reload(); return; }
  setTimeout(next, duration(s));
}

function start() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});  // ask the browser not to evict the videos
  try { const saved = JSON.parse(localStorage.getItem(STORE) || "null"); if (saved && saved.slides) set = saved; } catch (e) {}
  next();
}

/* Inside a frame (the iiSignage editor shows the page in one while you edit and save) show just the
   first slide and load nothing else for FRAMED_DELAY, then play normally. Loading the whole set
   there made saving a playlist crawl (2 Oct; example.com saved instantly). ?full skips the wait. */
async function preview() {
  try {
    const m = await (await fetch("slides.json?t=" + Date.now(), { cache: "no-store" })).json();
    const first = m.slides.find(s => s.type !== "video");
    if (!first) return;
    layers[0].onload = () => { layers[0].classList.add("on"); statusEl.style.display = "none"; };
    layers[0].src = first.src;
  } catch (e) { status("preview"); }
}

const FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (FRAMED &&!/[?&]full\b/.test(location.search)) {
  preview();
  setTimeout(start, FRAMED_DELAY);   // the first real slide fades in over the still (layer a)
} else {
  start();
}
</script>
</body>
</html>
